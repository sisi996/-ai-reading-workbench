<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 读书笔记 · 个人工作台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311907a'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23ffffff' font-family='serif'%3E%E9%98%85%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="app">

  <!-- 左侧固定导航 -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="logo">阅</div>
      <div>
        <h1>AI 读书笔记</h1>
        <small>READING WORKBENCH</small>
      </div>
    </div>
    <nav class="sidebar__nav">
      <div class="nav-item is-active" data-route="overview">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </span>
        <span>书籍总览</span>
        <span class="badge"></span>
      </div>
      <div class="nav-item" data-route="reading">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span>我的在读</span>
        <span class="badge"></span>
      </div>
      <div class="nav-item" data-route="done">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><polyline points="9.5 10.5 11.5 12.5 15.5 8"/></svg>
        </span>
        <span>我的读完</span>
        <span class="badge"></span>
      </div>
      <div class="nav-item" data-route="todo">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 8.5l7 1-5 4.5 1 7-6-3.5L6 21l1-7-5-4.5 7-1z"/></svg>
        </span>
        <span>我的未读</span>
        <span class="badge"></span>
      </div>
      <div class="nav-item" data-route="notes">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </span>
        <span>我的笔记</span>
        <span class="badge"></span>
      </div>
      <div class="nav-item" data-route="treasure">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8.5L12 16l-9-7.5"/><path d="M21 8.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5"/></svg>
        </span>
        <span>我的宝藏</span>
        <span class="badge"></span>
      </div>
      <div class="nav-item" data-route="trash">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </span>
        <span>宝藏回收</span>
        <span class="badge"></span>
      </div>
    </nav>

    <!-- 常驻侧栏底部：新标签页打开 GitHub -->
    <a class="nav-item nav-github" href="https://github.com" target="_blank" rel="noopener noreferrer"
       title="在新标签页打开 GitHub">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </span>
      <span class="gh-label">GitHub</span>
      <svg class="gh-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>

    <div class="sidebar__foot">
      <div class="conn" id="connChip" title="点击配置微信读书连接">
        <span class="dot"></span>
        <span class="txt"><b>演示模式</b><span>点击配置真实数据</span></span>
      </div>
      <div class="foot-line">数据来源：<strong>微信读书</strong></div>
      <div class="foot-line" id="footSync">正在读取…</div>
    </div>
  </aside>

  <!-- 右侧主内容 -->
  <main class="main">
    <div class="topbar">
      <h2 id="topbarTitle">书籍总览 <small>· All books</small></h2>
      <div class="topbar__search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="topbarSearch" placeholder="搜索书名 / 作者 / 分类…">
      </div>
      <button class="btn btn-ghost" id="btnSyncNotes" style="flex:none;"
              title="把微信读书里的划线 / 想法全部同步进来，并归到对应的书">⟳ 同步笔记</button>
      <button class="btn btn-ghost" id="settingsBtn" style="flex:none;">⚙ 连接设置</button>
    </div>
    <div id="viewRoot"></div>
  </main>
</div>

<script src="assets/mockData.js"></script>
<script src="assets/wereadClient.js"></script>
<script src="assets/apiService.js"></script>
<script src="assets/search.js"></script>
<script src="assets/aiService.js"></script>
<script src="assets/annotate.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
